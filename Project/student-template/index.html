<!DOCTYPE html>
<html id="parent" style="width: 100%; height: 100%; margin: 0; padding: 0;">

<head>
    <meta charset="utf-8">
    <title>WebGL Engine</title>
    <link rel="shortcut icon" href="favicon.ico" />
</head>

<body style="width: 100%; height: 100%; margin: 0; padding: 0">
    <!-- This is the navigation bar at the top of the page -->
    <!-- This is populated by loading the common functions script -->
    <div id="myNavBar"></div>

    <!-- This is for displaying errors caused by our JavaScript -->
    <!-- This will only be populated when an error on the JavaScript side occurs -->
    <div id="webglError"></div>

    <!-- Loading bar using a simple gif -->
    <div id="loadingPage" style="
    width: 100%;
    height: 100%;
    position: absolute;
    z-index: 10;
    background-color: black; 
    background-image: url(./loading.gif); 
    background-repeat: no-repeat; 
    background-position: center; ">
    </div>

    <!-- main canvas to be rendered -->
    <canvas id="glCanvas" style="width: 100%; height: 100%; display:block"></canvas>

    <!-- UI Overlay MUST be outside the canvas tag -->
    <div id="ui-overlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: white; font-family: sans-serif; z-index: 5;">
        <!-- HUD (Score + Lower-Center Torch Bar) -->
        <div id="hud" style="padding: 20px; font-size: 24px; display: none;">
            <div>Score: <span id="scoreText">0</span></div>
            <div>Coins: <span id="coinText">0</span></div>
            <div>High Score: <span id="highScoreText">0</span></div>
            <div style="font-size: 16px; opacity: 0.8; margin-top: 6px;">View Change (R)</div>

            <!-- Lower-Center Torch & Multiplier HUD -->
            <div style="position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); text-align: center;">
                <div id="multiplierText" style="font-size: 20px; font-weight: bold; margin-bottom: 6px; color: #cccccc;">1x</div>
                <div style="font-size: 18px;">Torch: <span id="torchText">100%</span></div>
                <div style="width: 280px; height: 14px; background: #333; border: 1px solid #888; margin: 6px auto 0 auto; border-radius: 6px; overflow: hidden;">
                    <div id="torchBar" style="width: 100%; height: 100%; background: #ffcc33; transition: width 0.05s linear;"></div>
                </div>
            </div>
        </div>

        <!-- Start / Game Over Menu -->
        <div id="menu"
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.75); padding: 30px; border-radius: 10px; pointer-events: auto;">
            <h1 id="menuTitle">Temple Run</h1>
            <p id="finalScoreText"></p>
            <button id="startBtn" style="padding: 10px 25px; font-size: 18px; cursor: pointer;">Start Game</button>
            <button id="exitBtn"
                style="padding: 10px 25px; font-size: 18px; cursor: pointer; margin-left: 10px;">Exit</button>
        </div>
    </div>



    <!-- This is a third party library for matrix math needed for WebGL calculations -->
    <!-- See http://glmatrix.net/ for documentation -->
    <script src="./lib/gl-matrix.js" type="text/javascript"></script>
    <script src="./lib/three-object-loader.js" type="text/javascript"></script>
    <script src="./src/commonFunctions.js" type="text/javascript"></script>
    <script src="./src/objects/RenderObject.js" type="text/javascript"></script>
    <script src="./src/objects/Cube.js" type="text/javascript"></script>
    <script src="./src/objects/Model.js" type="text/javascript"></script>
    <script src="./src/objects/Plane.js" type="text/javascript"></script>
    <script src="./src/objects/CustomObject.js" type="text/javascript"></script>
    <script src="./src/sceneFunctions.js" type="text/javascript"></script>
    <script src="./src/game.js" type="text/javascript"></script>

    <!-- This is our example 
    <script src="./main.js" type="text/javascript"></script>-->
    <script src="./src/main.js" type="text/javascript"></script>
    <script src="./src/uiSetup.js" type="text/javascript"></script>

</body>

</html>
